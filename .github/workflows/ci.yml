name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Demo smoke test
        run: researchos-fusion demo
      - name: Offline workflow smoke test
        shell: bash
        run: |
          set +e
          researchos-fusion lab-run examples/reference_run.json --ledger "$RUNNER_TEMP/runs.sqlite" > "$RUNNER_TEMP/report.json"
          result=$?
          set -e
          test "$result" -eq 1
          researchos-fusion ledger-verify "$RUNNER_TEMP/runs.sqlite"
      - name: Build and test installed wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/researchos-fusion" demo
          "$RUNNER_TEMP/wheel-env/bin/researchos-fusion" dt-energy --reactions 1e18
